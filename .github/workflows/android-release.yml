name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and verify signed APK
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify the release version
        shell: bash
        run: |
          version=$(yq -er '.version' pubspec.yaml)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\+[1-9][0-9]*$ ]] ||
             [[ "$GITHUB_REF_NAME" != "v${version%%+*}" ]]; then
            echo "::error::Use a tag such as v1.2.0 and a matching pubspec.yaml version such as 1.2.0+3."
            exit 1
          fi

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)
          if [[ -z "$sdkmanager" ]]; then
            echo "::error::Android SDK command-line tools are missing from the runner."
            exit 1
          fi
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - run: flutter pub get --enforce-lockfile

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" || -z "$ANDROID_RELEASE_PASSWORD" ]]; then
            echo "::error::Configure the Android signing secrets described in docs/android-release.md."
            exit 1
          fi
          umask 077
          ANDROID_RELEASE_KEYSTORE=$(mktemp "$RUNNER_TEMP/android-release.XXXXXX")
          export ANDROID_RELEASE_KEYSTORE
          trap 'rm -f -- "$ANDROID_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          unset ANDROID_RELEASE_KEYSTORE_BASE64
          flutter build apk --release

      - name: Verify APK and prepare release files
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          signature=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")
          signer=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$signature")
          if ! grep -qx 'Number of signers: 1' <<< "$signature" ||
             [[ "$signer" != "$(cat android/release-signing.sha256)" ]]; then
            echo "::error::The APK signature does not match the Fitness Tracker release certificate."
            exit 1
          fi
          # Read the version from the signed APK, not a separate release counter.
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")
          package=$(sed -n '/^package: /p' <<< "$badging")
          fields="^package: name='tn[.]dhibi[.]fitness_tracker' versionCode='([1-9][0-9]{0,9})' versionName='([^']+)'"
          if [[ ! "$package" =~ $fields ]]; then
            echo "::error::The APK has an unexpected application ID or version."
            exit 1
          fi
          code=${BASH_REMATCH[1]}
          version=${BASH_REMATCH[2]}
          if [[ "v$version" != "$GITHUB_REF_NAME" ]] || (( code > 2100000000 )); then
            echo "::error::The APK version must match the tag and use a valid Android versionCode."
            exit 1
          fi
          note=""
          if [[ "$(git cat-file -t "$GITHUB_REF")" == tag ]]; then
            note=$(git for-each-ref --format='%(contents:subject)' "$GITHUB_REF")
          fi

          mkdir release
          name="Fitness-Tracker-$GITHUB_REF_NAME.apk"
          cp "$apk" "release/$name"
          cd release
          sha256sum "$name" > SHA256SUMS.txt
          read -r digest _ < SHA256SUMS.txt
          jq -n --arg version "$version" --argjson code "$code" --arg digest "$digest" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name" \
            --arg note "$note" '
              {schemaVersion: 1, versionName: $version, versionCode: $code, apkUrl: $url, sha256: $digest}
              + (if $note == "" then {} else {notes: $note[:280]} end)
            ' > android-update.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-release
          path: release/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: android-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-release
          path: release

      - name: Publish APK, checksum, and update metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          sha256sum --check --strict SHA256SUMS.txt
          apk="Fitness-Tracker-$GITHUB_REF_NAME.apk"
          manifest=android-update.json
          read -r digest _ < SHA256SUMS.txt
          valid_code='select(type == "number" and . == floor and . >= 1 and . <= 2100000000)'
          code=$(jq -er --arg digest "$digest" --arg version "${GITHUB_REF_NAME#v}" '
            select(.schemaVersion == 1 and .sha256 == $digest and .versionName == $version)
            | .versionCode | '"$valid_code" "$manifest")

          complete_release() {
            jq -e --arg apk "$apk" --arg manifest "$manifest" '
              def uploaded($name): any(.assets[]; .name == $name and .state == "uploaded");
              .isPrerelease == false and uploaded($apk) and uploaded("SHA256SUMS.txt") and uploaded($manifest)
            ' >/dev/null
          }

          if existing=$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,assets); then
            if jq -e '.isDraft == false' <<< "$existing" >/dev/null &&
               complete_release <<< "$existing"; then
              echo "The release already has its APK, checksum, and update metadata."
              exit 0
            fi
            echo "::error::A draft or incomplete release exists for this tag. Inspect it in GitHub before retrying."
            exit 1
          fi

          # Build jobs can finish out of order. Compare while holding the publish lock.
          if latest=$(gh api --include "repos/$GH_REPO/releases/latest"); then
            latest_tag=$(awk 'body { print } /^\r?$/ { body = 1 }' <<< "$latest" |
              jq -er --arg manifest "$manifest" '
                if any(.assets[]; .name == $manifest and .state == "uploaded")
                then .tag_name else "" end
              ')
            if [[ -n "$latest_tag" ]]; then
              latest_code=$(gh release download "$latest_tag" --pattern "$manifest" --output - |
                jq -er 'select(.schemaVersion == 1) | .versionCode | '"$valid_code")
              if (( code <= latest_code )); then
                echo "::error::The APK build number must exceed the latest published build number ($latest_code)."
                exit 1
              fi
            fi
          elif [[ ! "$latest" =~ ^HTTP/[0-9.]+[[:space:]]404([[:space:]]|$) ]]; then
            echo "::error::Could not verify the latest Android release."
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "$apk" SHA256SUMS.txt "$manifest" \
            --verify-tag --title "Fitness Tracker $GITHUB_REF_NAME" --generate-notes --draft
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,assets)
          jq -e '.isDraft == true' <<< "$draft" >/dev/null
          complete_release <<< "$draft"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      # Releases published with GITHUB_TOKEN do not trigger release-event workflows.
      # Keep this outside the publish step so rerunning a completed release retries it.
      - name: Refresh website downloads
        shell: bash
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [[ -z "$CLOUDFLARE_PAGES_DEPLOY_HOOK" ]]; then
            echo "::error::Set CLOUDFLARE_PAGES_DEPLOY_HOOK as described in landing-page/README.md."
            exit 1
          fi
          curl --silent --show-error --fail --proto '=https' \
            --connect-timeout 10 --max-time 30 --request POST \
            --output /dev/null "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
