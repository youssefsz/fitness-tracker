name: fitness_tracker
description: An offline personal exercise log for repetitions and timed sets.
publish_to: none
version: 1.0.6+16

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.1
  crypto: ^3.0.8
  drift: ^2.35.4
  file_selector: ^1.1.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.11.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3: ^3.9.1
  uuid: ^4.6.0
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  cupertino_icons: ^1.0.9
  cupertino_ui: ^1.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.10.0
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mark.png
    - assets/brand/first-result.webp
    - assets/brand/progress-notebook.webp
    - assets/brand/update-handoff.webp
    - assets/avatars/
